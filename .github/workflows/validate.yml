name: Validate prototype

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and syntax-check embedded JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside_script = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.inside_script = True

              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      self.inside_script = False

              def handle_data(self, data):
                  if self.inside_script:
                      self.parts.append(data)

          parser = ScriptExtractor()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          source = "\n".join(parser.parts)
          if not source.strip():
              raise SystemExit("No inline JavaScript found in index.html")
          Path("/tmp/electron-logic-inline.js").write_text(source, encoding="utf-8")
          print(f"Extracted {len(source.splitlines())} lines of inline JavaScript.")
          PY
          node --check /tmp/electron-logic-inline.js
